<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
<script src="{{ '/js/analytics.js' | relative_url }}" defer></script>
</head>
<body>

{% include nav.html %}

{{ content }}

<footer>
  <div class="wrap">
    <div>
      <h2>Contact</h2>
      <p><a href="mailto:michaelajones.phd@gmail.com">michaelajones.phd@gmail.com</a></p>
    </div>
    <div>
      <p><a href="https://orcid.org/0000-0001-5822-0645">ORCID</a> &nbsp; <a href="https://www.linkedin.com/in/michaelaajones/">LinkedIn</a> &nbsp; <a href="https://bsky.app/profile/michaelajonesphd.bsky.social">Bluesky</a></p>
    </div>
  </div>
</footer>

<script>
  const btn = document.getElementById('menuBtn');
  const links = document.getElementById('links');
  btn.addEventListener('click', () => {
    const open = links.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
</script>
</body>
</html>
